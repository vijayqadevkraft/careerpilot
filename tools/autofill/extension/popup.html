<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareerPilot AutoFill</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      background: #38bdf8;
      color: #0f172a;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
    }
    .brand-name {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #10b981;
      font-weight: 600;
    }
    .profile-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .profile-name {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
      margin-bottom: 2px;
    }
    .profile-title {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .meta-item {
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .meta-item span.label {
      color: #64748b;
    }
    .btn-fill {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      transition: opacity 0.2s;
    }
    .btn-fill:hover {
      opacity: 0.9;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-link {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 7px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-link:hover {
      background: #334155;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-name">CareerPilot AutoFill</div>
    </div>
    <div class="toggle-container">
      <span>● Active</span>
    </div>
  </div>

  <div class="profile-box">
    <div class="profile-name">Vijay Kumar</div>
    <div class="profile-title">Senior QA Engineer / QA Lead (5 yrs)</div>
    <div class="meta-item">
      <span class="label">Email:</span>
      <span>vijaychuhan007@gmail.com</span>
    </div>
    <div class="meta-item">
      <span class="label">Phone:</span>
      <span>+91 7696122634</span>
    </div>
    <div class="meta-item">
      <span class="label">Notice:</span>
      <span>15 days (Immediate)</span>
    </div>
    <div class="meta-item">
      <span class="label">Location:</span>
      <span>India (Remote/Hubs)</span>
    </div>
  </div>

  <button class="btn-fill" id="btn-fill-now">⚡ Fill Current Page Now</button>

  <div class="links-grid">
    <a class="btn-link" id="link-test" href="http://localhost:3000/test_form.html" target="_blank">🧪 Test Form</a>
    <a class="btn-link" id="link-dashboard" href="http://localhost:3000" target="_blank">📊 Dashboard</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
